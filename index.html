<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clady Food Group | Website Coming Soon</title>
<meta name="description" content="Clady Food Group — Quality, Nutrition, Innovation. Our new website is coming soon." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cfg-green: #32533a;
    --cfg-olive: #7c7f3d;
    --cfg-gold: #f4bf44;
    --cfg-cream: #f5f4e5;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: var(--cfg-cream);
    color: var(--cfg-green);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  /* subtle background texture */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(124, 127, 61, 0.10) 0%, rgba(124, 127, 61, 0) 42%),
      radial-gradient(circle at 88% 82%, rgba(244, 191, 68, 0.14) 0%, rgba(244, 191, 68, 0) 45%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 640px;
    width: 100%;
  }

  .logo {
    width: min(340px, 62vw);
    height: auto;
    margin-bottom: clamp(28px, 5vw, 44px);
  }

  .coming-soon {
    font-weight: 500;
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cfg-olive);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .coming-soon .rule {
    display: block;
    width: 32px;
    height: 2px;
    background-color: var(--cfg-gold);
    border-radius: 2px;
  }

  footer {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 1;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--cfg-olive);
    opacity: 0.75;
  }

  @media (max-width: 480px) {
    .coming-soon {
      font-size: 1rem;
      gap: 10px;
    }
    .coming-soon .rule {
      width: 20px;
    }
  }
</style>
</head>
